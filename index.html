<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgriSmart</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#185c36"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f1f7ef;--c:#fff;--t:#243b2a;--g:#21834b;--r:#e5f4e7;--b:#b8cdbb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#122017;--c:#1c2e22;--t:#e3efe5;--g:#2e9e5e;--r:#243a2b;--b:#3d5a46}}
:root[data-theme="dark"]{--bg:#122017;--c:#1c2e22;--t:#e3efe5;--g:#2e9e5e;--r:#243a2b;--b:#3d5a46}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--t);line-height:1.6}
header{background:#185c36;color:#fff;padding:22px 5%}
header h1{margin:0 0 6px;font-size:26px}header p{margin:0}
main{max-width:900px;margin:auto;padding:16px}
.card{background:var(--c);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px #0001}
label{display:block;font-weight:bold;margin:12px 0 6px}
input,select{width:100%;padding:12px;font-size:16px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t)}
button{background:var(--g);color:#fff;border:0;padding:13px 18px;border-radius:8px;font-size:16px;margin-top:16px;width:100%;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tip{background:var(--r);padding:12px;border-radius:10px;margin-bottom:10px}
.crop{border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:10px}
.crop h3{margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
.bar{height:10px;background:var(--r);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%}
.crop small{display:block;opacity:.85}
nav{background:#10452a;padding:12px 5%;display:flex;gap:16px;flex-wrap:wrap}nav a{color:#fff;text-decoration:none;font-size:15px}
.hero{background:var(--r)}.hero h2{margin:0 0 6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.stat{background:var(--r);border-radius:10px;padding:12px;text-align:center}.stat b{display:block;font-size:22px;color:var(--g)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--b);text-align:left;font-size:14px}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:8px}.z{padding:16px 6px;border-radius:9px;color:#fff;text-align:center;font-weight:bold;font-size:14px}.zl{background:#39975a}.zm{background:#d39a28}.zh{background:#c95c4b}
input[type=range]{padding:0}
a{color:var(--g)}
#map{height:300px;border-radius:12px;margin:12px 0;z-index:0;background:var(--r)}
footer{text-align:center;padding:18px;font-size:14px;opacity:.8}
</style></head>
<body>
<header><h1>🌱 <span data-i="title"></span></h1><p data-i="sub"></p><p id="hl"></p></header>
<nav><a href="#home" data-i="n1"></a><a href="#nasa" data-i="n2"></a><a href="#planner" data-i="n3"></a><a href="#compare" data-i="n4"></a><a href="#field" data-i="n5"></a></nav>
<main>
<section class="card">
<label>🌐 Language / மொழி / भाषा / భాష / ഭാഷ</label>
<select id="lang" onchange="setLang()">
<option value="en">English</option><option value="ta">தமிழ்</option><option value="te">తెలుగు</option><option value="hi">हिन्दी</option><option value="ml">മലയാളം</option>
</select>
<div style="display:flex;gap:8px"><button onclick="speakPage()">🔊 <span data-i="ls"></span></button><button onclick="speechSynthesis.cancel()" style="background:#526d5b">⏹ <span data-i="st"></span></button></div>
</section>
<section class="card hero" id="home"><h2 data-i="hero"></h2><p data-i="heroP"></p></section>
<section class="card" id="place"><h2>📍 <span data-i="lt"></span></h2>
<p data-i="mt"></p><div id="map"></div><p id="mm" style="color:#c95c4b;margin:0 0 10px"></p>
<label data-i="dl"></label><select id="pl" onchange="pick()"></select>
<div class="grid"><div><label data-i="la"></label><input id="lat" type="number" step="0.0001" value="11.0168" onchange="manual()"></div><div><label data-i="ln"></label><input id="lon" type="number" step="0.0001" value="76.9558" onchange="manual()"></div></div>
<button onclick="myLoc()">🎯 <span data-i="us"></span></button>
<label data-i="sp"></label><input id="q" type="text" placeholder="Madurai, Kochi, Nairobi..." oninput="qd()"><button onclick="findPlace()" data-i="sb"></button><div id="qr"></div>
<div class="tip" id="lm" style="margin-top:12px;font-size:17px;font-weight:bold"></div><div id="topc"></div></section>
<section class="card" id="soilp"><h2>📷 <span data-i="q1"></span></h2><p data-i="q2"></p>
<input id="sf" type="file" accept="image/*" capture="environment" style="display:none" onchange="soilPhoto(this)">
<button onclick="$('sf').click()">📷 <span data-i="q3"></span></button>
<canvas id="scv" width="120" height="120" style="display:none"></canvas>
<div id="sres" style="display:none;margin-top:12px"><img id="simg" alt="" style="width:100%;max-height:220px;object-fit:cover;border-radius:10px"><div class="tip" id="sx" style="margin-top:10px"></div></div>
<p><small data-i="q6"></small></p></section>
<section class="card" id="nasa"><h2>🛰️ <span data-i="nt"></span></h2><p data-i="nd"></p>
<button onclick="loadNASA()" data-i="nl"></button><div class="tip" id="ns" style="margin-top:12px"></div>
<div class="stats"><div class="stat"><span data-i="at"></span><b id="vT">--</b></div><div class="stat"><span data-i="ar"></span><b id="vR">--</b></div><div class="stat"><span data-i="ah"></span><b id="vH">--</b></div><div class="stat"><span data-i="ad"></span><b id="vD">--</b></div><div class="stat"><span data-i="sw"></span><b id="vW">--</b></div></div>
<h3 data-i="rec"></h3><div class="tw"><table><thead><tr><th data-i="dt"></th><th data-i="tm"></th><th data-i="rf"></th><th data-i="hm"></th></tr></thead><tbody id="tb"></tbody></table></div>
<p><small data-i="src"></small></p></section>
<section class="card" id="planner"><h2>🌾 <span data-i="ft"></span></h2>
<div class="grid">
<div><label data-i="ph"></label><input id="ph" type="number" min="4" max="9" step="0.1" value="6.5"></div>
<div><label data-i="temp"></label><input id="temp" type="number" min="5" max="45" step="0.5" value="28"></div>
<div><label data-i="health"></label><select id="health"><option value="poor" data-i="poor"></option><option value="avg" selected data-i="avg"></option><option value="good" data-i="good"></option></select></div>
<div><label data-i="water"></label><select id="water"><option value="0" data-i="low"></option><option value="1" selected data-i="med"></option><option value="2" data-i="high"></option></select></div>
<div><label data-i="pr"></label><select id="pri"><option value="r1" data-i="pw"></option><option value="r2" data-i="ps"></option><option value="r3" data-i="pi"></option></select></div>
</div>
<button onclick="calc()" data-i="go"></button>
</section>
<section class="card" id="out" hidden>
<h2 data-i="res" style="margin-top:0"></h2>
<div id="tips"></div><div id="list"></div>
</section>
<section class="card" id="compare"><h2>📊 <span data-i="ct"></span></h2><p data-i="cn"></p><div id="cmp"></div></section>
<section class="card"><h2>🌦️ <span data-i="cl"></span></h2><p data-i="cx"></p>
<label><span data-i="rc"></span>: <span id="rn">0</span>%</label><input type="range" id="rs" min="-50" max="50" value="0" oninput="clim()">
<label><span data-i="tc"></span>: <span id="tn">0</span>°C</label><input type="range" id="ts" min="0" max="5" step="0.5" value="0" oninput="clim()">
<div class="tip" id="cm" style="margin-top:12px"></div></section>
<section class="card" id="field"><h2>🗺️ <span data-i="fm"></span></h2><p data-i="fd"></p><div class="zones" id="zs"></div></section>
<section class="card"><h2>🌿 <span data-i="wt"></span></h2><p data-i="w1"></p><p data-i="w2"></p><p data-i="w3"></p><p data-i="w4"></p></section>
<section class="card" id="res"><h2>🔗 <span data-i="xt"></span></h2>
<p><a href="https://power.larc.nasa.gov/" target="_blank" rel="noopener"><b>NASA POWER</b></a><br><span data-i="xp"></span></p>
<p><a href="https://www.earthdata.nasa.gov/data/platforms/space-based-platforms/smap" target="_blank" rel="noopener"><b>NASA SMAP</b></a><br><span data-i="xs"></span></p>
<p><a href="https://gpm.nasa.gov/data" target="_blank" rel="noopener"><b>NASA GPM / IMERG</b></a><br><span data-i="xg"></span></p>
<p><a href="https://www.earthdata.nasa.gov/data/instruments/srtm" target="_blank" rel="noopener"><b>NASA SRTM</b></a><br><span data-i="xe"></span></p>
<p><small data-i="xn"></small></p></section>
<section class="card"><h2>⚠️ <span data-i="it"></span></h2><p data-i="note"></p></section>
</main>
<footer><p data-i="ft2"></p><p>NASA POWER Data Services</p></footer>

ta:{tp:"சிறந்த பயிர்கள்",me:"வரைபடம் ஏற்றப்படவில்லை (இணையம் தேவை). பட்டியலில் மாவட்டத்தைத் தேர்ந்தெடுக்கவும் அல்லது தேடவும்.",dl:"மாவட்டம் / நகரத்தைத் தேர்ந்தெடுக்கவும்",q1:"மண் புகைப்படம்: pH மதிப்பீடு",q2:"பகல் வெளிச்சத்தில், நிழல் இல்லாமல் உலர்ந்த மண்ணின் புகைப்படம் எடுக்கவும் அல்லது பதிவேற்றவும். மண் நிறத்தைக் கொண்டு தோராயமான pH வரம்பை ஆப் மதிப்பிடும்.",q3:"மண் புகைப்படம் எடு / பதிவேற்று",q4:"மதிப்பிடப்பட்ட pH வரம்பு",q5:"மண் நிறம்",q6:"இது நிறத்தை மட்டும் வைத்த தோராய மதிப்பீடு. புகைப்படத்தால் pH ஐ துல்லியமாக அளவிட முடியாது. pH பட்டை, pH மீட்டர் அல்லது மண் நல பரிசோதனை மூலம் உறுதிப்படுத்தவும்.",q7:"திட்டத்தில் பயன்படுத்தப்படும் pH மதிப்பு",k1:"சிவப்பு மண்",k2:"மஞ்சள் கலந்த மண்",k3:"பழுப்பு மண்",k4:"கருமை / கரிசல் மண்",k5:"சாம்பல் / வெண்மை மண்",mt:"உங்கள் வயல் இடத்தைத் தேர்ந்தெடுக்க வரைபடத்தைத் தொடவும்.",ug:"பரிந்துரைகள்",sw:"மண் ஈரப்பதம் (வேர் மண்டலம்)",xt:"நாசா தரவு ஆதாரங்கள்",xp:"எந்த இடத்திற்கும் தினசரி வானிலை மற்றும் சூரியத் தரவு. இந்த செயலி இதை நேரடியாகப் பெறுகிறது.",xs:"மேற்பரப்பு மண் ஈரப்பதத்தின் செயற்கைக்கோள் வரைபடங்கள்; ஒவ்வொரு 2–3 நாட்களுக்கும் பூமியை உள்ளடக்கும்.",xg:"செயற்கைக்கோள்கள் மூலம் உலகளாவிய மழை மற்றும் பனி மதிப்பீடுகள் (IMERG, சுமார் 10 கிமீ கட்டம்).",xe:"கிட்டத்தட்ட உலகளாவிய நில உயரத் தரவு; சரிவு மற்றும் வடிகால் திட்டமிடலுக்குப் பயன்படும்.",xn:"இந்த செயலி POWER தரவை நேரடியாகப் பயன்படுத்துகிறது. SMAP, GPM, SRTM தரவை இந்த நாசா தளங்களில் பதிவிறக்கலாம்.",lt:"இடத்தைத் தேர்ந்தெடுக்கவும்",us:"என் இருப்பிடத்தைப் பயன்படுத்து",sp:"எந்த இடத்தையும் தேடுக",sb:"தேடு",la:"அட்சரேகை",ln:"தீர்க்கரேகை",lg:"இருப்பிட அனுமதி மறுக்கப்பட்டது அல்லது கிடைக்கவில்லை.",lf:"இடம் கிடைக்கவில்லை. பெயரையோ இணைய இணைப்பையோ சரிபார்க்கவும்.",lsel:"தேர்ந்தெடுத்த இடம்",ne:"நாசா தரவைப் பெற முடியவில்லை. இணைய இணைப்பைச் சரிபார்க்கவும்.",ls:"பக்கத்தைக் கேட்கவும்",st:"குரலை நிறுத்தவும்",loc:"📍 கோயம்புத்தூர், தமிழ்நாடு, இந்தியா",n1:"முகப்பு",n2:"நாசா தரவு",n3:"பயிர் திட்டம்",n4:"ஒப்பீடு",n5:"வயல் வரைபடம்",hero:"சிறப்பாக பயிரிடுங்கள். நீரை சேமியுங்கள். மண்ணைப் பாதுகாப்போம்.",heroP:"நாசா POWER வானிலைத் தரவு, விவசாயி விவரங்கள் மற்றும் காலநிலை சூழல்களுடன் பயிர் சுழற்சியை ஆராயுங்கள்.",nt:"நாசா புவி தரவு பலகை",nd:"நாசா POWER தேர்ந்தெடுத்த எந்த இடத்திற்கும் வரலாற்று வானிலைத் தரவை வழங்குகிறது.",nl:"நாசா தரவைப் பெறுக",nn:"வானிலைத் தரவு இன்னும் பெறப்படவில்லை.",nld:"நாசா தரவு ஏற்றப்படுகிறது...",nok:"நாசா POWER தரவு வெற்றிகரமாகப் பெறப்பட்டது.",nsn:"இந்தப் பக்கத்தில் நேரடி நாசா இணைப்பு தடுக்கப்பட்டுள்ளது; முன்பு பெற்ற மாதிரித் தரவு காட்டப்படுகிறது. நேரடித் தரவுக்கு GitHub Pages இல் வெளியிடவும்.",at:"சராசரி வெப்பநிலை",ar:"மொத்த மழைப்பொழிவு",ah:"சராசரி ஈரப்பதம்",ad:"தரவு நாட்கள்",rec:"சமீபத்திய தினசரிப் பதிவுகள்",dt:"தேதி",tm:"வெப்பநிலை",rf:"மழை",hm:"ஈரப்பதம்",src:"ஆதாரம்: நாசா POWER. கணக்கீட்டு மதிப்பீடு, நேரடி வயல் அளவீடு அல்ல.",ft:"விவசாயி தகவல்கள்",pr:"விவசாயி முன்னுரிமை",pw:"நீரை சேமித்தல்",ps:"மண் வளத்தை மேம்படுத்துதல்",pi:"கூடுதல் வருமானம்",r1:"பரிந்துரை: சிறுதானியங்களுக்குப் பிறகு பயறு வகைகள்; குறைந்த நீர் சூழலுக்கு ஏற்றது.",r2:"பரிந்துரை: மக்காச்சோளத்திற்குப் பிறகு பயறு வகைகள் அல்லது மூடுபயிர்; மண் நைட்ரஜனை மீட்டெடுக்கும்.",r3:"பரிந்துரை: உள்ளூருக்கு ஏற்றால் நிலக்கடலைக்குப் பிறகு சோளம். சந்தைத் தேவையைச் சரிபார்க்கவும்.",ct:"சுழற்சி உத்தி ஒப்பீடு",cn:"இவை மாதிரி மதிப்பெண்கள் மட்டுமே; உண்மையான வயல் தரவு அல்ல.",si:"மண் மேம்பாடு",we:"நீர் பயன்பாட்டுத் திறன்",sg:"சோளம்",cl:"காலநிலை மாற்ற ஆய்வு",cx:"கற்பனையான காலநிலை மாற்றங்களை ஆராயுங்கள்.",rc:"மழை மாற்றம்",tc:"வெப்பநிலை மாற்றம்",cr0:"மழையும் வெப்பநிலையும் அடிப்படை நிலைக்கு அருகில் உள்ளன.",cr1:"அதிக மழை திறந்த வயல்களில் மண் அரிப்பு அபாயத்தை அதிகரிக்கலாம்.",cr2:"குறைந்த மழை நீர் பற்றாக்குறையை அதிகரிக்கலாம்.",cr3:"அதிக வெப்பநிலை பயிர்களுக்கு வெப்ப அழுத்தத்தையும் நீர் தேவையையும் அதிகரிக்கலாம்.",fm:"வயல் பாதிப்பு வரைபடம்",fd:"இவை மாதிரிப் பகுதிகள்; உண்மையான அபாய அளவீடு அல்ல.",zn:"பகுதி",rl:"குறைந்த அபாயம்",rm:"நடுத்தர அபாயம்",rh:"அதிக அபாயம்",wt:"ஏன் பயிர் சுழற்சி?",w1:"பயறு வகைகள்: உயிரியல் நைட்ரஜன் நிலைப்படுத்தலால் மண்ணில் நைட்ரஜன் சேர்க்கும்.",w2:"மூடுபயிர்கள்: மண்ணைப் பாதுகாத்து அரிப்பைக் குறைக்கும்.",w3:"ஆழ வேர் பயிர்கள்: மண் அமைப்பை மேம்படுத்தலாம்.",w4:"வறட்சி தாங்கும் பயிர்கள்: குறைந்த நீரிலும் நன்றாக வளரலாம்.",it:"முக்கிய குறிப்பு",ft2:"அக்ரிஸ்மார்ட் | நிலையான எதிர்காலத்திற்கான நவீன விவசாயம்",title:"அக்ரிஸ்மார்ட் – பயிர் ஆலோசகர்",sub:"மண் விவரங்களை உள்ளிட்டு பொருத்தமான பயிர்களை அறியுங்கள்",ph:"மண் pH (4–9)",temp:"வெப்பநிலை (°C)",health:"மண் வளம்",water:"கிடைக்கும் நீர்",poor:"மோசம்",avg:"சராசரி",good:"நல்லது",low:"குறைவு",med:"நடுத்தரம்",high:"அதிகம்",go:"பொருத்தமான பயிர்களைக் காண்க",res:"முடிவுகள்",phr:"ஏற்ற pH",tr:"ஏற்ற வெப்பநிலை",wn:"நீர் தேவை",s1:"மிகவும் ஏற்றது",s2:"ஏற்றது",s3:"குறைவான பொருத்தம்",s4:"ஏற்றதல்ல",acid:"மண் அமிலத்தன்மை: வேளாண் சுண்ணாம்பு மற்றும் இயற்கை உரம் இடவும்.",alk:"மண் காரத்தன்மை: ஜிப்சம், உரம், பசுந்தாள் உரம் இடவும்.",neu:"pH பெரும்பாலான பயிர்களுக்கு ஏற்ற அளவில் உள்ளது.",hp:"மண் வளம் குறைவு: தொழு உரம் இடவும், பயறு வகை பயிரிடவும், அதிக உழவைத் தவிர்க்கவும்.",ha:"மண் வளம் சராசரி: பயிர் சுழற்சி மற்றும் இயற்கை உரம் பயன்படுத்தவும்.",hg:"மண் வளம் நல்லது: பயிர் சுழற்சி, மூடாக்கு மூலம் பராமரிக்கவும்.",note:"மாதிரி கருவி. முடிவெடுக்கும் முன் உள்ளூர் வேளாண் அலுவலரிடம் உறுதிப்படுத்தவும்.",c:["நெல்","மக்காச்சோளம்","நிலக்கடலை","சிறுதானியங்கள்","பருத்தி","கரும்பு","பயறு வகைகள்","தக்காளி"]},
te:{tp:"ఉత్తమ పంటలు",me:"మ్యాప్ లోడ్ కాలేదు (ఇంటర్నెట్ అవసరం). జాబితా నుండి జిల్లాను ఎంచుకోండి లేదా శోధించండి.",dl:"జిల్లా / నగరం ఎంచుకోండి",q1:"నేల ఫోటో: pH అంచనా",q2:"పగటి వెలుతురులో, నీడ లేకుండా పొడి నేల ఫోటో తీయండి లేదా అప్‌లోడ్ చేయండి. నేల రంగు ఆధారంగా సుమారు pH పరిధిని యాప్ అంచనా వేస్తుంది.",q3:"నేల ఫోటో తీయండి / అప్‌లోడ్",q4:"అంచనా pH పరిధి",q5:"నేల రంగు",q6:"ఇది రంగు ఆధారంగా మాత్రమే చేసిన సుమారు అంచనా. ఫోటోతో pH ను ఖచ్చితంగా కొలవలేము. pH స్ట్రిప్, pH మీటర్ లేదా నేల ఆరోగ్య కార్డ్ పరీక్షతో నిర్ధారించుకోండి.",q7:"ప్రణాళికలో ఉపయోగించిన pH విలువ",k1:"ఎర్ర నేల",k2:"పసుపు రంగు నేల",k3:"గోధుమ రంగు నేల",k4:"ముదురు / నల్ల నేల",k5:"బూడిద / తెల్లని నేల",mt:"మీ పొలం స్థానాన్ని ఎంచుకోవడానికి మ్యాప్‌ను తాకండి.",ug:"సూచనలు",sw:"నేల తేమ (వేరు మండలం)",xt:"నాసా డేటా వనరులు",xp:"ఏ స్థలానికైనా రోజువారీ వాతావరణ, సౌర డేటా. ఈ యాప్ దీన్ని నేరుగా తీసుకుంటుంది.",xs:"ఉపరితల నేల తేమ ఉపగ్రహ పటాలు; ప్రతి 2–3 రోజులకు భూమిని కవర్ చేస్తాయి.",xg:"ఉపగ్రహాల నుండి ప్రపంచ వర్ష, మంచు అంచనాలు (IMERG, సుమారు 10 కి.మీ గ్రిడ్).",xe:"దాదాపు ప్రపంచవ్యాప్త భూ ఎత్తు డేటా; వాలు, నీటి పారుదల ప్రణాళికకు ఉపయోగపడుతుంది.",xn:"ఈ యాప్ POWER డేటాను నేరుగా వాడుతుంది. SMAP, GPM, SRTM డేటాను ఈ నాసా సైట్ల నుండి డౌన్‌లోడ్ చేయవచ్చు.",lt:"స్థలాన్ని ఎంచుకోండి",us:"నా స్థానాన్ని ఉపయోగించు",sp:"ఏ స్థలాన్నైనా వెతకండి",sb:"వెతుకు",la:"అక్షాంశం",ln:"రేఖాంశం",lg:"స్థాన అనుమతి నిరాకరించబడింది లేదా అందుబాటులో లేదు.",lf:"స్థలం దొరకలేదు. పేరు లేదా ఇంటర్నెట్ కనెక్షన్ చూడండి.",lsel:"ఎంచుకున్న స్థలం",ne:"నాసా డేటా లోడ్ కాలేదు. ఇంటర్నెట్ కనెక్షన్ చూడండి.",loc:"📍 కోయంబత్తూరు, తమిళనాడు, భారతదేశం",n1:"హోమ్",n2:"నాసా డేటా",n3:"పంట ప్రణాళిక",n4:"పోలిక",n5:"పొలం మ్యాప్",hero:"మంచిగా పండించండి. నీటిని ఆదా చేయండి. నేలను రక్షించండి.",heroP:"నాసా POWER వాతావరణ డేటా, రైతు వివరాలు మరియు వాతావరణ దృశ్యాలతో పంట మార్పిడిని అన్వేషించండి.",nt:"నాసా భూ డేటా డాష్‌బోర్డ్",nd:"నాసా POWER ఎంచుకున్న ఏ స్థలానికైనా గత వాతావరణ డేటాను అందిస్తుంది.",nl:"నాసా డేటాను పొందండి",nn:"వాతావరణ డేటా ఇంకా లోడ్ కాలేదు.",nld:"నాసా డేటా లోడ్ అవుతోంది...",nok:"నాసా POWER డేటా వ let lang="en",shown=false,nsKey="nn";const g=k=>L[lang][k]||L.en[k];
const $=id=>document.getElementById(id);const esc=t=>String(t).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const dist=(v,r)=>v<r[0]?r[0]-v:v>r[1]?v-r[1]:0;
function setLang(){
  lang=$("lang").value;document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=g(e.dataset.i));setNS(nsKey);showLoc();showSoil();cmp();clim();fz();

function calc(){
  const T=L[lang],ph=parseFloat($("ph").value),t=parseFloat($("temp").value),h=$("health").value,w=+$("water").value;
  if(isNaN(ph)||isNaN(t))return;
  const tips=[g("ug")+": "+plc.n+" · "+t+" °C · pH "+ph,g($("pri").value),ph<6?T.acid:ph>7.8?T.alk:T.neu,h==="poor"?T.hp:h==="avg"?T.ha:T.hg];
  $("tips").innerHTML=tips.map(x=>"<div class='tip'>"+x+"</div>").join("");
  const res=C.map((c,i)=>{
    let s=Math.max(0,40-dist(ph,c.p)*40)+Math.max(0,40-dist(t,c.t)*8)+[20,10,0][Math.abs(w-c.w)]+(h==="poor"&&c.g?6:0);
    return{c,i,s:Math.min(100,Math.round(s))};
  }).sort((a,b)=>b.s-a.s);
  $("list").innerHTML=res.map(r=>{
    const k=r.s>=80?1:r.s>=60?2:r.s>=40?3:4,col=["","#2e9e5e","#7bb33a","#d39a28","#c95c4b"][k];
